name: VJ requirements posts

# Manual for now. Once we trust it, add:
#   push:
#     branches: [main]
#     paths: ['discord/vj-requirements/**']
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit updated message IDs back
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Discord
        working-directory: discord/vj-requirements
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_VJ_REQUIREMENTS }}
        run: bash send.sh

      - name: Commit message IDs
        run: |
          cd discord/vj-requirements
          if ! git diff --quiet ids.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ids.json
            git commit -m "record VJ requirements message IDs [skip ci]"
            git push
          else
            echo "no ID changes"
          fi
