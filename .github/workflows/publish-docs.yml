name: Publish docs to Discord

# Manual only. Pick a channel; it builds + posts/edits that channel's messages.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel folder to publish
        required: true
        type: choice
        options:
          - vj-requirements
          - rules
          - verified-editor-requirements
          # add each new channel folder here as you onboard it

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit updated message IDs back
    env:
      # One line per channel. Secret name = WEBHOOK_<CHANNEL>, uppercased, - -> _.
      WEBHOOK_VJ_REQUIREMENTS: ${{ secrets.WEBHOOK_VJ_REQUIREMENTS }}
      WEBHOOK_RULES: ${{ secrets.WEBHOOK_RULES }}
      WEBHOOK_VERIFIED_EDITOR_REQUIREMENTS: ${{ secrets.WEBHOOK_VERIFIED_EDITOR_REQUIREMENTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve webhook + publish
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          dir="discord/$CHANNEL"
          [ -d "$dir" ] || { echo "no such channel folder: $dir"; exit 1; }
          var="WEBHOOK_$(echo "$CHANNEL" | tr 'a-z-' 'A-Z_')"
          url="${!var:-}"
          [ -n "$url" ] || { echo "missing secret for $CHANNEL (env $var)"; exit 1; }
          WEBHOOK_URL="$url" bash discord/_engine/send.sh "$dir"

      - name: Commit message IDs
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          dir="discord/$CHANNEL"
          # git diff alone misses a brand-new (untracked) ids.json on a channel's first
          # publish, so message IDs never got committed back. git status catches both
          # a modified tracked file and a new untracked one.
          if [ -n "$(git status --porcelain "$dir/ids.json")" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$dir/ids.json"
            git commit -m "record $CHANNEL message IDs [skip ci]"
            git push
          else
            echo "no ID changes"
          fi
